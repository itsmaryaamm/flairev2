# Render blueprint: one Postgres and the FastAPI backend.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
databases:
  - name: flaire-db
    plan: free

services:
  - type: web
    name: flaire-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: flaire-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RECEIPT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: API_BASE_URL
        value: https://flaire-api-cmrs.onrender.com
      - key: AUTH_ENGINE
        value: native
      - key: CORS_ORIGINS
        value: https://flaire-paypal.vercel.app   # replace with your Vercel domain
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_RECEIVER_EMAIL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_CHECKOUT_APPROVAL
        value: "true"
      - key: FRONTEND_URL
        value: https://flaire-paypal.vercel.app

